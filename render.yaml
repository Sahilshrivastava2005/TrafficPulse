services:
  # Backend FastAPI Web Service
  - type: web
    name: trafficpulse-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "PYTHONPATH=. uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # Frontend React Static Site
  - type: web
    name: trafficpulse-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: trafficpulse-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
